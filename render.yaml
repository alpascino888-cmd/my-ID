services:
  - type: web
    name: portfolio-ps6h
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: >-
      pip install -r requirements.txt &&
      npm --prefix frontend ci &&
      npm --prefix frontend run build &&
      python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/projects/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USE_TLS
        value: "False"
      - key: EMAIL_USE_SSL
        value: "True"
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CONTACT_RECIPIENT_EMAIL
        sync: false

databases:
  - name: portfolio-db
    databaseName: portfolio
    user: portfolio
    plan: free
    region: frankfurt
